<div class="header">
  <a class="title" title="Show overview" [routerLink]="['/project', project.key, 'explore']">
    Workspace
  </a>
  <button class="collapse" nz-button nzType="text" nzSize="small" nz-tooltip aria-label="Collapse folders"
    nzTooltipTitle="Collapse folders" (click)="collapseAll()">
    <i nz-icon nzType="menu-fold" nzTheme="outline" aria-hidden="true"></i>
  </button>
  <button class="refresh" nz-button nzType="text" nzSize="small" nz-tooltip aria-label="Refresh the workspace"
    nzTooltipTitle="Click to refresh the workspace" (click)="load()">
    <i nz-icon nzType="sync" [nzSpin]="loading" nzTheme="outline" aria-hidden="true"></i>
  </button>
</div>
<div class="content">
  @for (vcs of vcss; track vcs.name) {
    <div class="tree-node-header" appClickable [attr.aria-expanded]="!!expanded[vcs.name]" (click)="clickVCS(vcs)">
      <span nz-icon [nzType]="expanded[vcs.name] ? 'caret-down' : 'caret-right'" nzTheme="fill" aria-hidden="true"></span>
      <div class="name">{{vcs.name}}</div>
      <button nz-button nzSize="small" title="Add a new Repository"
        (click)="openRepositoryAddDrawer(vcs.name); $event.stopPropagation()">
        <i nz-icon nzType="plus" nzTheme="outline" aria-hidden="true"></i>
        Repository
      </button>
    </div>
    @if (expanded[vcs.name]) {
      <div class="tree-node-content">
        @if (!repositories[vcs.name]?.length) {
          <nz-alert nzType="info" nzMessage="No repository found"></nz-alert>
        }
        @for (repo of repositories[vcs.name]; track repo.name) {
          <a class="tree-node-header repository" [class.distant]="repo.distant" [title]="repo.name"
            [routerLink]="['/project', project.key, 'explore', 'vcs', vcs.name, 'repository', repo.name]" routerLinkActive="active"
            nz-tooltip [nzTooltipTitle]="repo.distant ? 'Listened by a workflow of this project, not declared in it' : ''">
            <span nz-icon [nzType]="repo.distant ? 'link' : 'folder'" nzTheme="outline" aria-hidden="true"></span>
            <span class="name">{{repo.name}}</span>
          </a>
        }
      </div>
    }
  }
</div>
