name: Hook workflow run with path filter
vars:
  cds_project: "ITV2HOOKWORKFLOWRUNPATHS"
  git_repo_from: "it_v2_hook_workflow_run_paths_from"
  git_repo_to: "it_v2_hook_workflow_run_paths_to"
  cds_workflow_from: "WorkflowFrom"
  cds_workflow_to: "WorkflowTo"
  worker_model: "{{.cds_project}}/my_vcs_server/{{.git.user}}/{{.git_repo_to}}/docker-debian"
testcases:
- name: Prepare test
  steps:
    - name: "Verify cdsctl configuration"
      script: "{{.cdsctl}} -f {{.cdsctl.config}} user me --format json"
      vars:
        cdsUser:
          from: result.systemoutjson.username
    - name: "Display username"
      info: "Connected CDS user is {{.cdsUser}}"
    - type: v2_install_gpg_key
      cdsctl_command: "{{.cdsctl}} -f {{.cdsctl.config}}"
      gpg_key_id: "{{.gpg.key_id}}"
      git_host: "{{.git.host}}"
      git_user: "{{.git.user}}"
      git_password: "{{.git.password}}"
      vars:
        emailaddress:
          from: result.emailaddress
    - type: v2_create_project
      cdsctl_command: "{{.cdsctl}} -f {{.cdsctl.config}}"
      cds_project: "{{.cds_project}}"
      git_host: "{{.git.host}}"
      git_user: "{{.git.user}}"
      git_password: "{{.git.password}}"
      cds_region: "{{.cds.region}}"
      git_emailAddress: "{{.emailaddress}}"

    - type: v2_add_git_repo
      cdsctl_command: "{{.cdsctl}} -f {{.cdsctl.config}}"
      cds_project: "{{.cds_project}}"
      cds_hook_url: "{{.forgejo.hook.url}}"
      git_host: "{{.git.host}}"
      git_user: "{{.git.user}}"
      git_password: "{{.git.password}}"
      git_repo: "{{.git_repo_from}}"

    - type: v2_add_git_repo
      cdsctl_command: "{{.cdsctl}} -f {{.cdsctl.config}}"
      cds_project: "{{.cds_project}}"
      cds_hook_url: "{{.forgejo.hook.url}}"
      git_host: "{{.git.host}}"
      git_user: "{{.git.user}}"
      git_password: "{{.git.password}}"
      git_repo: "{{.git_repo_to}}"

- name: PushWorkflowWithHook
  steps:
    - type: v2_push_cds_files_on_repo
      git_repo: "{{.git_repo_to}}"
      git_host: "{{.git.host}}"
      git_user: "{{.git.user}}"
      git_email: "{{.Prepare-test.emailaddress}}"
      git_password: "{{.git.password}}"
      gpg_key_id: "{{.gpg.key_id}}"
      files:
        worker-models/debian.yml:
          name: docker-debian
          osarch: linux/amd64
          type: docker
          spec:
            image: buildpack-deps:bookworm
        workflows/to.yaml:
          name: {{.cds_workflow_to}}
          on:
            workflow-run:
            - workflow: "{{.git.user}}/{{.git_repo_from}}/{{.cds_workflow_from}}"
              status: [Success]
              branches: [master,main]
              paths: [foo.*]
          jobs:
            init:
              runs-on: {{.worker_model}}
              steps:
                - run: |
                    env
                    echo "Parent: ${{cds.event.workflow_run.git.repository}}"

- name: Check analysis repo_to
  steps:
    - name: Check CDS project analyses status
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental project analysis list {{.cds_project}} my_vcs_server {{.git.user}}/{{.git_repo_to}} --format json"
      assertions:
        - result.systemoutjson ShouldHaveLength 2
        - result.systemoutjson.systemoutjson0.status ShouldEqual "Skipped"
        - result.systemoutjson.systemoutjson1.status ShouldEqual "Success"
      retry: 100
      delay: 1

    - name: Check that the CDS workflow to has no execution
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental workflow history {{.cds_project}} my_vcs_server {{.git.user}}/{{.git_repo_to}} {{.cds_workflow_to}} --format json"
      assertions:
        - result.systemoutjson ShouldHaveLength 0

- name: PushFromWorkflow
  steps:
    - type: v2_push_cds_files_on_repo
      git_repo: "{{.git_repo_from}}"
      git_host: "{{.git.host}}"
      git_user: "{{.git.user}}"
      git_email: "{{.Prepare-test.emailaddress}}"
      git_password: "{{.git.password}}"
      gpg_key_id: "{{.gpg.key_id}}"
      files:
        worker-models/debian.yml:
          name: docker-debian
          osarch: linux/amd64
          type: docker
          spec:
            image: buildpack-deps:bookworm
        workflows/from.yaml:
          name: {{.cds_workflow_from}}
          on: [push]
          repository:
            name: "{{.git.user}}/{{.git_repo_from}}"
            vcs: my_vcs_server
          jobs:
            init:
              runs-on: {{.worker_model}}
              steps:
                - run: echo Hello

- name: WorkflowFromFirstExecution
  steps:
    - name: Check CDS project analyses status
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental project analysis list {{.cds_project}} my_vcs_server {{.git.user}}/{{.git_repo_from}} --format json"
      assertions:
        - result.systemoutjson ShouldHaveLength 2
        - result.systemoutjson.systemoutjson0.status ShouldEqual "Skipped"
        - result.systemoutjson.systemoutjson1.status ShouldEqual "Success"
      retry: 100
      delay: 1

    - name: Check that the CDS workflow from has one execution and is Success
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental workflow history {{.cds_project}} my_vcs_server {{.git.user}}/{{.git_repo_from}} {{.cds_workflow_from}} --format json"
      assertions:
        - result.systemoutjson ShouldHaveLength 1
        - result.systemoutjson.systemoutjson0.status ShouldEqual "Success"
      retry: 150
      delay: 1
      vars:
        parentRunID:
          from: result.systemoutjson.systemoutjson0.id

# The parent changesets only contain .cds files: the workflow-run hook must be skipped by the path filter
- name: WorkflowToSkippedByPathFilter
  steps:
    # Outgoing events survive a project re-creation on a dev stack: select the one of the current parent run
    - name: Get the outgoing hook of the first parent run
      script: {{.cdsctl}} -f {{.cdsctl.config}} admin services request --name `{{.cdsctl}} -f {{.cdsctl.config}} admin services list -q|grep hooks|head -n1` --query /admin/outgoing/{{.cds_project}}/my_vcs_server/{{.git.user}}%2F{{.git_repo_from}}/{{.cds_workflow_from}} | jq -c '[.[] | select(.event.WorkflowRunID=="{{.WorkflowFromFirstExecution.parentRunID}}")]'
      assertions:
        - result.systemoutjson ShouldHaveLength 1
        - result.systemoutjson.systemoutjson0.status ShouldEqual Done
        - result.systemoutjson.systemoutjson0.HooksToTriggers ShouldHaveLength 1
        - result.systemoutjson.systemoutjson0.HooksToTriggers.HooksToTriggers0.workflow_name ShouldEqual {{.cds_workflow_to}}
        - result.systemoutjson.systemoutjson0.HooksToTriggers.HooksToTriggers0.status ShouldEqual Done
        - result.systemoutjson.systemoutjson0.HooksToTriggers.HooksToTriggers0.repository_event_id ShouldNotBeEmpty
      retry: 60
      delay: 1
      vars:
        eventID:
          from: result.systemoutjson.systemoutjson0.HooksToTriggers.HooksToTriggers0.repository_event_id

    - name: Check that the workflow-run hook has been skipped by the path filter
      script: "{{.cdsctl}} -f {{.cdsctl.config}} admin services request --name `{{.cdsctl}} -f {{.cdsctl.config}} admin services list -q|grep hooks|head -n1` --query /v2/repository/event/my_vcs_server/{{.git.user}}%2F{{.git_repo_to}}/{{.eventID}}"
      assertions:
        - result.systemoutjson.status ShouldEqual Done
        - result.systemoutjson.workflows ShouldHaveLength 1
        - result.systemoutjson.workflows.workflows0.workflow_name ShouldEqual {{.cds_workflow_to}}
        - result.systemoutjson.workflows.workflows0.status ShouldEqual Skipped
        - result.systemoutjson.workflows.workflows0.error ShouldEqual "no file matches path filters"
      retry: 60
      delay: 1

    - name: Check that the CDS workflow to still has no execution
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental workflow history {{.cds_project}} my_vcs_server {{.git.user}}/{{.git_repo_to}} {{.cds_workflow_to}} --format json"
      assertions:
        - result.systemoutjson ShouldHaveLength 0

# A parent commit touching a file matching the path filter triggers the child workflow
- name: PushMatchingFileOnFrom
  steps:
    - name: Push a signed commit adding foo.bar
      script: cd /tmp/repos/{{.git_repo_from}} && touch foo.bar && git add foo.bar && git commit --gpg-sign={{.gpg.key_id}} -m "add foo.bar file" && git push

    - name: Check that the CDS workflow from has two executions and the last one is Success
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental workflow history {{.cds_project}} my_vcs_server {{.git.user}}/{{.git_repo_from}} {{.cds_workflow_from}} --format json"
      assertions:
        - result.systemoutjson ShouldHaveLength 2
        - result.systemoutjson.systemoutjson0.status ShouldEqual "Success"
      retry: 150
      delay: 1
      vars:
        parentRunID:
          from: result.systemoutjson.systemoutjson0.id

- name: WorkflowToExecution
  steps:
    - name: Check that the CDS workflow to has exactly one execution
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental workflow history {{.cds_project}} my_vcs_server {{.git.user}}/{{.git_repo_to}} {{.cds_workflow_to}} --format json"
      assertions:
        - and:
          - result.systemoutjson ShouldHaveLength 1
          - or:
            - result.systemoutjson.systemoutjson0.status ShouldEqual "Success"
            - result.systemoutjson.systemoutjson0.status ShouldEqual "Fail"
      retry: 150
      delay: 1
      vars:
        workflowRunID:
          from: result.systemoutjson.systemoutjson0.id

    - name: Display run info
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental workflow info {{.cds_project}} {{.workflowRunID}}"

    - name: Display job info
      script: "{{.cdsctl}} -f {{.cdsctl.config}} experimental workflow jobs status {{.cds_project}} {{.workflowRunID}}"

    - name: Download and check logs
      script: |-
        #!/bin/bash
        set -e
        FILE=/tmp/`uuidgen`
        mkdir -p $FILE && cd $FILE
        {{.cdsctl}} -f {{.cdsctl.config}} experimental workflow logs download {{.cds_project}} {{.workflowRunID}}
        echo "Display logs"
        cat {{.cds_workflow_to}}*
        echo "Check logs"
        cat {{.cds_workflow_to}}* | grep "GIT_REPOSITORY={{.git.user}}/{{.git_repo_to}}"
        cat {{.cds_workflow_to}}* | grep "Parent: {{.git.user}}/{{.git_repo_from}}"
      retry: 60
      delay: 1

    - name: Check that the second parent run triggered the workflow through its outgoing hook
      script: {{.cdsctl}} -f {{.cdsctl.config}} admin services request --name `{{.cdsctl}} -f {{.cdsctl.config}} admin services list -q|grep hooks|head -n1` --query /admin/outgoing/{{.cds_project}}/my_vcs_server/{{.git.user}}%2F{{.git_repo_from}}/{{.cds_workflow_from}} | jq -c '[.[] | select(.event.WorkflowRunID=="{{.PushMatchingFileOnFrom.parentRunID}}")]'
      assertions:
        - result.systemoutjson ShouldHaveLength 1
        - result.systemoutjson.systemoutjson0.status ShouldEqual Done
        - result.systemoutjson.systemoutjson0.HooksToTriggers ShouldHaveLength 1
        - result.systemoutjson.systemoutjson0.HooksToTriggers.HooksToTriggers0.workflow_name ShouldEqual {{.cds_workflow_to}}
        - result.systemoutjson.systemoutjson0.HooksToTriggers.HooksToTriggers0.status ShouldEqual Done
      retry: 60
      delay: 1
